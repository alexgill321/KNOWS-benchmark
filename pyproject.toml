[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "browsergym-knows"
description = "KNOWS: a Google Workspace (Docs, Sheets, Slides) benchmark for web agents, packaged for BrowserGym"
authors = [
    {name = "Alexander Gill"},
    {name = "Md Farhan Ishmam"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["benchmark", "web-agents", "browsergym", "google-workspace", "llm-evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["dependencies", "optional-dependencies", "version"]

[project.urls]
Homepage = "https://alexgill321.github.io/KNOWS-benchmark"
Repository = "https://github.com/alexgill321/KNOWS-benchmark"
Issues = "https://github.com/alexgill321/KNOWS-benchmark/issues"
Dataset = "https://huggingface.co/datasets/utahnlp/knows-benchmark"

[tool.hatch.version]
path = "src/browsergym/knows/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
local-models = ["requirements-local-models.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/browsergym"]
# Gold data (~225 MB) exceeds PyPI's 100 MB file limit; it is published as a
# GitHub release asset and fetched on first use (eval_utils/data_paths.py).
exclude = [
    "src/browsergym/knows/eval/tasks/*/instance_*/data/",
    "**/perturbation_testing/",
]

[tool.hatch.build.targets.sdist]
# Closed allowlist: pip builds the wheel from this when no wheel matches, so it
# must hold exactly the package sources and nothing else from the repo root.
only-include = ["src/browsergym", "README.md", "LICENSE", "requirements.txt", "requirements-local-models.txt"]
exclude = [
    "src/browsergym/knows/eval/tasks/*/instance_*/data/",
    "**/perturbation_testing/",
]
